# Phase 2 -- Client-Server Encryption (DH + AES-256-GCM) + MITM Proxy
#
# Normal chat:
#   docker compose -f docker-compose.phase2.yml up --build -d
#   docker attach chat-client1
#   docker attach chat-client2
#
# MITM demo (run proxy inside mallory, then point a client at it instead of
# the real server):
#   docker compose -f docker-compose.phase2.yml exec -d mallory \
#       ./build/run_proxy 12346 172.28.0.10 12345
#   docker compose -f docker-compose.phase2.yml exec client1 \
#       ./build/run_client 172.28.0.13 12346
#   docker logs chat-mallory      # shows intercepted plaintext
#
#   docker compose -f docker-compose.phase2.yml down

services:
  server:
    build:
      context: ./Phase2
      dockerfile: ../docker/server.Dockerfile
    container_name: chat-server
    networks:
      chatnet:
        ipv4_address: 172.28.0.10
    command: ["./build/run_server", "12345"]
    ports:
      - "12345:12345"

  client1:
    build:
      context: ./Phase2
      dockerfile: ../docker/client.Dockerfile
    container_name: chat-client1
    networks:
      chatnet:
        ipv4_address: 172.28.0.11
    stdin_open: true
    tty: true
    depends_on:
      - server
    command: ["./build/run_client", "172.28.0.10", "12345"]

  client2:
    build:
      context: ./Phase2
      dockerfile: ../docker/client.Dockerfile
    container_name: chat-client2
    networks:
      chatnet:
        ipv4_address: 172.28.0.12
    stdin_open: true
    tty: true
    depends_on:
      - server
    command: ["./build/run_client", "172.28.0.10", "12345"]

  mallory:
    build:
      context: ./Phase2
      dockerfile: ../docker/mallory.Dockerfile
    container_name: chat-mallory
    networks:
      chatnet:
        ipv4_address: 172.28.0.13
    stdin_open: true
    tty: true
    depends_on:
      - server
    command: ["sleep", "infinity"]

networks:
  chatnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
