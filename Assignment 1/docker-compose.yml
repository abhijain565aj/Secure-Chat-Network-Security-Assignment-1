services:
  server:
    build:
      context: ./Phase2
      dockerfile: ../docker/server.Dockerfile
    container_name: chat-server
    networks:
      chatnet:
        ipv4_address: 172.28.0.10
    command: ["./build/run_server", "12345"]
    ports:
      - "12345:12345"

  client1:
    build:
      context: ./Phase2
      dockerfile: ../docker/client.Dockerfile
    container_name: chat-client1
    networks:
      chatnet:
        ipv4_address: 172.28.0.11
    stdin_open: true
    tty: true
    command: ["./build/run_client", "172.28.0.10", "12345"]

  client2:
    build:
      context: ./Phase2
      dockerfile: ../docker/client.Dockerfile
    container_name: chat-client2
    networks:
      chatnet:
        ipv4_address: 172.28.0.12
    stdin_open: true
    tty: true
    command: ["./build/run_client", "172.28.0.10", "12345"]

  mallory:
    build:
      context: ./Phase2
      dockerfile: ../docker/mallory.Dockerfile
    container_name: chat-mallory
    networks:
      chatnet:
        ipv4_address: 172.28.0.13
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

networks:
  chatnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
